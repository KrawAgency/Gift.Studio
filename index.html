<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#DCF0FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F2030" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gift Studio">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>(function(){var t;try{t=localStorage.getItem('gs-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<title>Gift Studio v25.4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:ital,wght@0,400;0,500;0,600;1,700&display=swap" rel="stylesheet">
<style>
/* v11 · una sola paleta (la de v10) en los dos temas.
   Los nombres --orange / --gold se conservan por compatibilidad: --orange = acento de acción (verde azulado),
   --gold = acento VIP (azul), --navy = superficies VIP, --ok = texto de "te queda / ahorras". */
:root{
  --bg-top:#DCF0FA; --bg-bot:#FFFAF3; --card:#FFFFFF; --soft:#F8F6E6; --ink:#2E2F43; --muted:#62637A; --line:#E4E4EE;
  --orange:#235C53; --orange-ink:#FFFFFF; --star:#0072CE;
  --navy:#2E2F43; --gold:#0072CE; --gold-text:#DCF0FA; --wine:#9B4C45; --forest:#235C53;
  --ok:#235C53; --ok-soft:#EEF5E8; --ok-line:#A3C98E; --warn:#9B4C45; --knob-reg:#6B6C80; --knob-vip:#2E2F43;
  --wish-bg:#FFFAF3; --wish-line:#E3C9C5; --wish-ink:#9B4C45; --wish-sub:#7E625E;
  --bill-a:#A3C98E; --bill-b:#5E9A7C; --bill-line:#235C53;
  --ui:'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --script:'Playfair Display', Georgia, 'Times New Roman', serif;
  --nav-h:76px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-top:#1D2833; --bg-bot:#16171E; --card:#23242D; --soft:#2C2D37; --ink:#F1F1F5; --muted:#A6A7B6; --line:#393A47;
    --orange:#2B8273; --star:#5AA9EC;
    --navy:#2A2B40; --gold:#2F7CC4; --gold-text:#DCF0FA; --wine:#D08A82; --forest:#3A9182;
    --ok:#8FDDB2; --ok-soft:#1E3A2E; --ok-line:#2F5C47; --warn:#FF9C85; --knob-reg:#5A5B6C; --knob-vip:#2F7CC4;
    --wish-bg:#3A2330; --wish-line:#5C3447; --wish-ink:#F58AB0; --wish-sub:#D9A9BC;
    --bill-a:#7CC59A; --bill-b:#3E9467; --bill-line:#2F7A52;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg-top:#1D2833; --bg-bot:#16171E; --card:#23242D; --soft:#2C2D37; --ink:#F1F1F5; --muted:#A6A7B6; --line:#393A47;
  --orange:#2B8273; --star:#5AA9EC;
  --navy:#2A2B40; --gold:#2F7CC4; --gold-text:#DCF0FA; --wine:#D08A82; --forest:#3A9182;
  --ok:#8FDDB2; --ok-soft:#1E3A2E; --ok-line:#2F5C47; --warn:#FF9C85; --knob-reg:#5A5B6C; --knob-vip:#2F7CC4;
    --wish-bg:#3A2330; --wish-line:#5C3447; --wish-ink:#F58AB0; --wish-sub:#D9A9BC;
    --bill-a:#7CC59A; --bill-b:#3E9467; --bill-line:#2F7A52;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;background:var(--bg-bot)}
body{margin:0;min-height:100%;background:linear-gradient(180deg,var(--bg-top) 0,var(--bg-bot) 520px) no-repeat,var(--bg-bot);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
:focus-visible{outline:2.5px solid var(--orange);outline-offset:2px;border-radius:12px}
svg{display:block}
.wrap{max-width:1400px;margin:0 auto;padding:0 18px}

/* ── Vendor strip ── */
.vendor{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--navy);color:#fff;display:none}
.vendor.on{display:block}
.vendor .wrap{display:flex;align-items:center;gap:10px 18px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:8px}
.step-btn{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);color:var(--gold-text);font-size:22px;line-height:1;display:grid;place-items:center}
.step-btn:disabled{opacity:.3;cursor:not-allowed}
.step-val{min-width:64px;text-align:center;line-height:1}
.step-val strong{display:block;font-size:22px;font-weight:600;color:var(--gold-text);font-variant-numeric:tabular-nums}
.step-val small{font-size:11px;opacity:.7}
.qual{font-weight:600;font-size:13px;border-radius:999px;padding:5px 12px;background:rgba(255,255,255,.14)}
.qual.CT{background:#5B5C70}.qual.QB{background:var(--forest)}.qual.QA{background:var(--wine)}
.v-used{font-size:13px;opacity:.8;font-variant-numeric:tabular-nums}
.v-pay{margin-left:auto;text-align:right;line-height:1.1}
.v-pay strong{font-size:24px;font-weight:600;display:block;font-variant-numeric:tabular-nums}
.v-pay small{font-size:11px;opacity:.75}
.v-icon{background:rgba(255,255,255,.12);color:#fff;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.v-icon svg{width:18px;height:18px}
@media (max-width:640px){.v-used,#fsBtn{display:none}.v-pay small{display:none}}

/* ── Header ── */
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:2px;padding-bottom:6px}
.brand{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:30px;font-weight:700;font-style:italic;letter-spacing:-.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:font-size .2s ease}
.icons{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:5px;box-shadow:0 4px 14px -8px rgba(46,47,67,.3)}
.lang{display:flex}
.lang button{padding:7px 10px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);min-height:36px}
.lang button[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.badge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:999px;background:var(--orange);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.badge:empty{display:none}

/* ── Budget pill (search-bar style) ── */

/* ── Layout ── */
.layout .wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;padding-top:14px;padding-bottom:calc(var(--nav-h) + 40px)}
@media (min-width:1080px){
  .layout .wrap{grid-template-columns:minmax(0,1fr) 360px;align-items:start}
  .nav{display:none!important}
  .layout .wrap{padding-bottom:60px}
  #cartView{display:block!important;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--vend-h,0px) + 76px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - var(--vend-h,0px) - 92px);overflow-y:auto;overscroll-behavior:contain;border-radius:26px;scrollbar-width:thin}
  .ab-cart{display:none!important}
  .cta-bar{bottom:0!important}
  #catalogView{display:block!important}
}

/* ── Hero (certificado) ── */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);background:var(--navy);color:#fff;border-radius:26px;overflow:hidden;border:2px solid var(--gold);min-height:190px;box-shadow:0 12px 24px -16px rgba(42,43,64,.7)}
.hero-body{padding:18px 6px 18px 20px;display:flex;flex-direction:column;gap:6px;justify-content:center;text-align:left;color:#fff}
.hero-kicker{font-size:12px;opacity:.75}
.hero h2{margin:0;font-family:var(--script);font-style:italic;font-weight:700;font-size:clamp(28px,7vw,54px);line-height:.95;color:var(--gold-text);white-space:nowrap}
.hero .lede{margin:0;font-size:13px;opacity:.9;max-width:30ch}
.hero-facts{display:none;gap:16px;margin-top:4px}
.hero-facts div{font-size:12px;opacity:.8;line-height:1.25;border-top:1.5px solid rgba(233,185,73,.5);padding-top:6px}
.hero-facts b{display:block;font-size:15px;font-weight:600;opacity:1;color:#fff}
.hero-actions{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.hero-add{border-radius:999px;background:var(--gold);color:#fff;font-weight:600;font-size:14px;padding:10px 18px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.hero-add[aria-pressed="true"]{background:#fff;color:var(--navy)}
.hero-add svg{width:16px;height:16px}
.hero-more{color:#fff;font-size:13px;font-weight:500;padding:10px 8px;opacity:.85;text-decoration:underline;text-underline-offset:3px;min-height:44px}
.hero-photo{background-size:cover;background-position:center 30%;border-left:5px solid var(--gold)}
.hero .vtag-hero{display:none;position:absolute;top:10px;right:10px;font-size:11px;font-weight:600;color:#fff;background:var(--wine);border-radius:6px;padding:2px 7px}
@media (min-width:760px){.hero{min-height:250px;grid-template-columns:minmax(0,1fr) minmax(0,.9fr)}.hero-body{padding:26px 10px 26px 28px}.hero .lede{font-size:15px;max-width:38ch}.hero-facts{display:flex}}

/* ── Modo: sin / con VIP ── */
.modes{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:999px;padding:5px;margin-top:12px;box-shadow:0 4px 14px -10px rgba(46,47,67,.3)}
.modes button{position:relative;z-index:1;border-radius:999px;min-height:48px;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;line-height:1.15}
.modes button[aria-pressed="true"]{color:#fff}
.modes .knob{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:999px;background:var(--knob-reg);transition:transform .3s cubic-bezier(.3,1.3,.5,1),background .3s ease}
body.mode-vip .modes .knob{transform:translateX(100%);background:var(--knob-vip)}
body.mode-vip .modes button[data-mode="vip"]{color:var(--gold-text)}
.modes .star{color:var(--gold)}
body.mode-reg{--orange:#6B6B78}
.hero-lock{position:absolute;inset:0;background:rgba(31,31,36,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;color:#fff;z-index:2}
.hero-lock p{margin:0;font-weight:600;font-size:16px;max-width:30ch}
.hero-lock svg{width:26px;height:26px;color:var(--gold-text)}
.hero-lock button{border-radius:999px;background:var(--gold);color:#fff;font-weight:600;font-size:14px;padding:10px 18px;min-height:44px}
body.mode-reg .hero .hero-lock{filter:grayscale(0)}

/* ── Comparación ── */
.vs{margin-top:14px;border-radius:22px;overflow:hidden;border:1.5px solid var(--line)}
.vs-head{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 4px;font-size:13px;color:var(--muted)}
.vs-head b{color:var(--ink);font-size:15px}
.vs-cols{display:grid;grid-template-columns:1fr 1fr}
.vs-col{padding:10px 14px 14px;display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;cursor:pointer;transition:filter .15s ease}
.vs-col:not(.cur):hover{filter:brightness(1.08)}
.vs-col:active{filter:brightness(.95)}
.vs-col .go{margin-top:6px;font-size:12.5px;font-weight:600;opacity:.85;text-decoration:underline;text-underline-offset:3px}
.vs-col.reg{background:var(--soft)}
.vs-col.vip{background:var(--navy);color:#fff}
.vs-col .lbl{font-size:12px;font-weight:600;opacity:.75}
.vs-col.vip .lbl{color:var(--gold-text);opacity:1}
.vs-col .big{font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.vs-col .small{font-size:12px;opacity:.75;line-height:1.35}
.vs-col .val{font-size:14px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.vs-btn{width:100%;padding:12px;font-weight:600;font-size:14px;color:var(--ink);background:var(--card);border-top:1.5px solid var(--line);min-height:48px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp-col{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cmp-col.reg{background:var(--soft)}
.cmp-col.vip{background:var(--navy);color:#fff}
.cmp-col h3{margin:0;font-size:14px;font-weight:600}
.cmp-col.vip h3{color:var(--gold-text)}
.cmp-col ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.3}
.cmp-col li{display:flex;gap:6px}
.cmp-col li b{flex-shrink:0;min-width:22px}
.cmp-col .none{font-size:13px;opacity:.7}
.cmp-col .tot{margin-top:auto;border-top:1px solid rgba(127,127,127,.3);padding-top:8px;font-size:12px;opacity:.85;display:flex;flex-direction:column;gap:2px}
.cmp-col .tot b{font-size:20px;opacity:1;font-variant-numeric:tabular-nums}
.cmp-note{font-size:13px;color:var(--muted);margin:0}

/* ── v6: carrito único ── */
.vs-msg{margin:0;padding:14px 14px 0;font-weight:600;font-size:16px;line-height:1.35}
.vs-msg2{margin:0;padding:4px 14px 12px;font-size:13px;color:var(--muted);line-height:1.35}
.vs-col .st{font-size:13px;font-weight:600;color:var(--ok)}
.vs-col.vip .st{color:#9FE3C4}
.vs-col .st.over,.row .over,.cmp-t .over{color:var(--warn);font-weight:600}
.vs-col.vip .st.over{color:#FF9C85}
.vs-col.cur{box-shadow:inset 0 -4px 0 var(--orange)}
.vs-col.vip.cur{box-shadow:inset 0 -4px 0 var(--gold)}
.gmeter.over i{background:var(--warn)}
.ci-na{opacity:.5}
.cmp-wrap{overflow-x:auto;border-radius:18px;border:1.5px solid var(--line)}
.cmp-t{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp-t th,.cmp-t td{padding:10px 12px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.cmp-t th:first-child,.cmp-t td:first-child{text-align:left}
.cmp-t thead th{border-top:0;font-size:12px;font-weight:600;color:var(--muted);background:var(--soft)}
.cmp-t thead th.vip{background:var(--navy);color:var(--gold-text)}
.cmp-t td.vip{background:rgba(42,43,64,.06);font-weight:600}
.cmp-t td small{color:var(--muted)}
.cmp-t td small s{display:block;font-size:11.5px}
.cmp-t td.na{color:var(--muted)}
.cmp-t tfoot td{font-weight:600}
.cmp-t tr.tot td{font-size:16px;border-top:2px solid var(--ink)}

/* ── Gift vouchers ── */
.vrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;min-height:64px}
.vstack{position:relative;flex-shrink:0;width:calc(72px + (var(--n) - 1) * 12px);height:34px}
.vstack:has(.vstar){width:34px}
.vch{position:absolute;top:calc(var(--i, 0) * -1px);left:calc(var(--i, 0) * 12px);width:72px;height:29px;border-radius:5px;background-size:cover;background-position:center;box-shadow:0 2px 6px -2px rgba(70,70,20,.45);border:1px solid rgba(110,110,40,.25);transform:rotate(calc(var(--i, 0) * 2deg - 4deg))}
.vch:not(.used){filter:saturate(.7) brightness(1.04)}
.vch.used{outline:2px solid var(--ink);outline-offset:-1px}
.vstar{position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;background:var(--knob-vip);color:var(--gold-text);display:grid;place-items:center;font-size:16px}
.vrow{touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:default}
@keyframes nudge{20%{transform:translateX(-5px)}50%{transform:translateX(4px)}80%{transform:translateX(-2px)}}
.vch.pop{animation:vpop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes vpop{0%{transform:translateY(-14px) scale(.6) rotate(-12deg);opacity:0}100%{opacity:1}}
.vtxt{flex:1;min-width:0;line-height:1.25}
.vtxt b{display:block;font-weight:600;font-size:15px;color:var(--ink)}
.vtxt small{display:block;font-size:12.5px;color:var(--muted)}

/* ── v8.1 ── */
.pc.off .pc-img,body.mode-reg .pc.off .pc-img{filter:none}
.pc.off .pc-img::after{content:"";position:absolute;inset:0;backdrop-filter:grayscale(1) brightness(1.06);-webkit-backdrop-filter:grayscale(1) brightness(1.06);pointer-events:none}
.pc-tools,.lock{z-index:2}
.lock.over{font-weight:600}
.lock.newtag{background:var(--navy);color:var(--gold-text);font-weight:600}
.pill-wish{display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--wish-ink);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:13px;min-height:38px;box-shadow:0 4px 10px -4px rgba(0,0,0,.25)}
.pill-wish i{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--wish-ink) 14%,transparent);display:grid;place-items:center;font-style:normal;font-size:16px}
.pill-wish.on{background:var(--wish-ink);color:var(--card)}.pill-wish.on i{background:rgba(255,255,255,.2);color:#fff}
.gstack{position:relative;flex-shrink:0;width:calc(48px + (var(--n) - 1) * 5px);min-width:56px;height:34px}
.gstack i{position:absolute;left:calc(var(--i) * 5px);top:calc(var(--i) * -1px);width:44px;height:26px;border-radius:5px;background:linear-gradient(135deg,var(--bill-a),var(--bill-b));border:1.5px solid var(--bill-line);box-shadow:0 2px 4px -2px rgba(0,0,0,.4);margin-top:5px}
.gstack i::after{content:"$";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.gstack i.none{border:1.5px dashed var(--bill-a);background:transparent;box-shadow:none}.gstack i.none::after{content:""}
.gflash{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-weight:700;font-size:18px;color:var(--ok);opacity:0;pointer-events:none}
.gflash.go{animation:gfl .8s ease-out}
@keyframes gfl{0%{opacity:0;transform:translateY(0)}25%{opacity:1}100%{opacity:0;transform:translateY(-130%)}}
.sugg{margin-top:12px;border-radius:20px;background:var(--soft);padding:12px}
.sugg-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.sugg-head b{font-size:15px}.sugg-head span{font-size:12px;color:var(--muted)}
.sugg-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sg{position:relative;background:var(--card);border-radius:16px;padding:6px 6px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sg.fresh{box-shadow:0 0 0 2px var(--gold)}
.sg-img{position:relative;aspect-ratio:16/10;border-radius:12px;background-size:cover;background-position:center;margin-bottom:4px;cursor:pointer}
.sg-img span{position:absolute;left:6px;top:6px;background:var(--navy);color:var(--gold-text);font-size:10.5px;font-weight:600;border-radius:999px;padding:2px 8px}
.sg b{font-size:12.5px;font-weight:600;line-height:1.25;padding:0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sg small{font-size:12px;color:var(--ok);font-weight:600;padding:0 4px}
.sg-add{position:absolute;right:10px;bottom:10px;width:32px;height:32px;border-radius:50%;background:var(--orange);color:#fff;font-size:20px;line-height:1;display:grid;place-items:center}
.wish{margin-top:12px;border-radius:20px;background:var(--wish-bg);border:1.5px solid var(--wish-line);padding:12px;display:flex;flex-direction:column;gap:8px}
.wish-head b{display:block;color:var(--wish-ink);font-size:15px}.wish-head small{font-size:12px;color:var(--wish-sub)}
.wi{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:6px}
.wi-img{width:48px;height:48px;border-radius:10px;background-size:cover;background-position:center;flex-shrink:0;cursor:pointer}
.wi-txt{flex:1;min-width:0}.wi-txt b{display:block;font-size:13.5px;font-weight:600;line-height:1.25}.wi-txt small{font-size:12px;color:var(--warn);font-weight:500}
.wi-move{background:var(--orange);color:#fff;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;min-height:36px;white-space:nowrap}
.wi .rm{width:32px;height:32px;border-style:solid;border-color:var(--line);color:var(--muted)}
.wgap{margin:2px 2px 0;font-size:13.5px;font-weight:600;color:var(--warn)}.wgap.ok{color:var(--ok)}
.wi-all{background:var(--forest);color:#fff;border-radius:999px;padding:11px;font-weight:600;font-size:14px;min-height:46px}
.wneg{display:none;flex-direction:column;gap:8px;background:var(--navy);color:#fff;border-radius:14px;padding:10px 12px;font-size:12.5px;line-height:1.4}
.wneg b{color:var(--gold-text)}
.wneg button{align-self:flex-start;background:var(--gold);color:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;min-height:40px}
body.is-vendor .wneg{display:flex}

/* ── v8.2: desglose con Leisure Cash ── */
.cmp-t td.vip span{display:block;line-height:1.3}
.cmp-t .lcv{color:var(--ink);font-weight:700}
.cmp-t .free{color:var(--ok);font-weight:700}
.cmp-t tr.lcrow td{font-size:13px}

/* ── v8.3 ── */
.pks{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pk{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--soft);padding:4px 10px 4px 4px;font-size:12.5px;font-weight:500;min-height:32px;color:var(--ink)}
.pk i{width:22px;height:22px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700}
.pk-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pk-row > span{font-size:14px;font-weight:500;color:var(--muted)}

/* ── v8.4 ── */
.pkg{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:2px 3px 2px 0}
.pkg .pk{background:transparent}
.cbdt{border-radius:999px;font-size:11.5px;font-weight:600;padding:5px 9px;min-height:28px;color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.cbdt.on{background:var(--orange);color:#fff}
.sc.cbdsc[aria-pressed="true"]{background:var(--orange);color:#fff}
.ci-addon{padding-left:28px;border-top-style:dashed!important}
.ci-addon .ci-img{width:52px;height:52px;position:relative;filter:saturate(.6)}
.ci-addon .ci-img span{position:absolute;inset:auto 4px 4px 4px;text-align:center;background:var(--orange);color:#fff;font-size:10px;font-weight:700;border-radius:6px;padding:1px 0}
.ci-addon .ci-txt b{font-size:13.5px}
.pill-add.vipgo{background:var(--navy);color:var(--gold-text)}.pill-add.vipgo i{background:var(--gold);color:var(--navy)}

/* ── v8.5 ── */
.subchips{margin-top:8px}
.subchips .chip{min-height:38px;padding:7px 14px;font-size:13px}
.subchips .chip[aria-pressed="true"]{background:var(--navy);color:var(--gold-text)}
.menu{margin:0;padding-left:18px;color:var(--muted);font-size:14px;line-height:1.5;display:flex;flex-direction:column;gap:4px}

/* ── v8.6 ── */
.sh-foot.stack{flex-direction:column;align-items:stretch;gap:8px}
.sh-foot.stack .cta{width:100%;flex:none;margin-top:0}
.ghost-cta{background:var(--soft)!important;color:var(--ink)!important}

/* ── v8.7 ── */
.pc-price b.promo{color:var(--ok)}
.reg-lbl{font-size:12px;color:var(--muted)}
.reg-lbl s{text-decoration-color:var(--warn);text-decoration-thickness:1.5px}
.anchor-pill span.promo{background:var(--orange)!important;color:#fff!important}

/* ── v8.8 ── */
.force{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px 14px;background:color-mix(in srgb,var(--warn) 10%,transparent);border:1.5px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.force-txt{flex:1;min-width:0;line-height:1.3}
.force-txt b{display:block;color:var(--warn);font-size:15px}
.force-txt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.force-btn{flex-shrink:0;border-radius:999px;padding:10px 14px;min-height:44px;font-weight:600;font-size:13.5px;color:var(--warn);border:1.5px solid var(--warn);background:transparent}

/* ── v8.9 ── */
.hero-mini{display:flex;align-items:center;gap:12px;background:var(--navy);border:2px solid var(--gold);border-radius:20px;padding:8px 10px 8px 8px;color:#fff;animation:hmIn .3s ease-out}
@keyframes hmIn{from{opacity:.4;transform:scale(.98)}to{opacity:1;transform:none}}
.hm-photo{width:64px;height:64px;border-radius:14px;background-size:cover;background-position:center 30%;flex-shrink:0;cursor:pointer}
.hm-txt{flex:1;min-width:0;text-align:left;color:#fff;line-height:1.25}

.hm-txt small{display:block;font-size:12.5px;opacity:.85}

.hm-added svg{width:15px;height:15px}

/* ── v9.0 ── */
.lock.topt,.sg-img span.topt{background:var(--gold);color:#fff;font-weight:700}

/* ── v9.1 ── */

.pax{display:flex;flex-direction:column;gap:10px;background:var(--soft);border-radius:18px;padding:12px 14px}
.pax-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pax-row b{display:block;font-size:15px}.pax-row small{display:block;font-size:12.5px;color:var(--muted)}
.pax .qty{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:4px}
.pax .qty button{width:38px;height:38px;border-radius:50%;background:var(--soft);font-size:20px;display:grid;place-items:center;line-height:1}
.pax .qty button.plus{background:var(--orange);color:#fff}
.pax .qty button:disabled{opacity:.35;cursor:not-allowed}
.pax .qty span{min-width:20px;text-align:center;font-weight:600;font-size:16px}
.pax-tot{margin:0;font-weight:600;font-size:14px;color:var(--ink)}
.pax-over{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--warn);font-weight:600;font-size:13px}
.paxbtn{border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;background:var(--soft);min-height:36px}


/* toggle de tema */
.tl{display:flex;align-items:center;gap:10px;min-width:0}
.thm{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:999px;padding:3px;box-shadow:0 4px 14px -8px rgba(46,47,67,.3)}
.thm button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.thm button svg{width:16px;height:16px}
.thm button[aria-pressed="true"]{background:var(--soft);color:var(--ink)}

/* ── v10 · encabezado en dos filas + contorno de tarjetas ── */
.top .wrap{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:12px}
.hdr-row{display:flex;align-items:center;gap:8px}
.hdr-row .icons{padding:4px}
.thm{padding:4px}
.pc,.sg{border:1.5px solid var(--line)}
.pc{background:var(--card);border-radius:24px;padding:6px 6px 12px}
.pc .pc-img{border-radius:18px}
.pc.sel{border:2.5px solid var(--orange);padding:5px 5px 11px}
.pc.sel .pc-img{box-shadow:none}
/* ── v9.5 ── */
.ph-hydro_aerial{background-image:url(img/28.webp)}
.ph-hydro_couple{background-image:url(img/29.webp)}
.ph-hydro_sauna{background-image:url(img/30.webp)}

.ph-hydro_circuit{background-image:url(img/31.webp)}

.ph-cabana_ext{background-image:url(img/32.webp)}
.ph-cellar3{background-image:url(img/33.webp)}
.ph-cabana_map{background-image:url(img/34.webp)}
.sh-img.main.ph-cabana_map{aspect-ratio:496/250}

.sc.dur{min-width:78px}
.sc .vt2{display:block;font-size:11px;font-weight:600;opacity:.8;margin-top:1px}

/* ── Chips ── */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:18px -18px 0;padding:2px 18px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:var(--card);border-radius:999px;padding:10px 18px;font-weight:500;font-size:14px;min-height:44px;box-shadow:0 3px 10px -8px rgba(46,47,67,.35)}
.chip[aria-pressed="true"]{background:var(--orange);color:#fff}

/* ── Product grid ── */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;margin-top:16px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1280px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pc{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0}
.pc-img{position:relative;aspect-ratio:1/1;border-radius:22px;background-size:cover;background-position:center;background-color:var(--line);overflow:hidden;cursor:pointer;transition:filter .35s ease,box-shadow .2s ease}
.pc.sel .pc-img{box-shadow:0 0 0 3px var(--orange)}
.pc.off .pc-img{filter:grayscale(1) contrast(.85) brightness(1.08)}
.pc.off .pc-info{opacity:.55}
.pc-tools{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;align-items:center}
.pill-add{display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px 4px 4px;font-weight:500;font-size:13px;min-height:38px;box-shadow:0 4px 10px -4px rgba(0,0,0,.25)}
.pill-add i{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-style:normal;font-size:18px;line-height:1}
.pill-add:disabled{opacity:.6;cursor:not-allowed}
.mini-step{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:999px;padding:4px;box-shadow:0 4px 10px -4px rgba(0,0,0,.25)}
.mini-step button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:18px;line-height:1;border:1.5px solid var(--line)}
.mini-step button.plus{background:var(--orange);border-color:var(--orange);color:#fff}
.mini-step button:disabled{opacity:.35;cursor:not-allowed}
.mini-step span{min-width:20px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.lock{position:absolute;left:8px;top:8px;right:8px;display:inline-flex;align-items:center;gap:6px;width:max-content;max-width:calc(100% - 16px);background:rgba(31,31,36,.78);color:#fff;font-size:11.5px;font-weight:500;padding:5px 10px;border-radius:999px;line-height:1.2}
.lock svg{width:12px;height:12px;flex-shrink:0}
.vtag{display:none;position:absolute;left:8px;bottom:12px;font-size:11px;font-weight:600;color:#fff;background:var(--wine);border-radius:6px;padding:2px 7px}
body.is-vendor .vtag,body.is-vendor .hero .vtag-hero{display:inline-block}
.pc-info{display:flex;flex-direction:column;gap:2px;text-align:left;padding:0 4px;cursor:pointer;width:100%}
.pc-info > *{flex-shrink:0;max-width:100%}
.pc-info h3{margin:0;font-size:15px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-info p{margin:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-price{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:2px}
.pc-price b{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.pc-price s{font-size:12px;color:var(--muted)}
.pc-price .more{font-size:12px;color:var(--orange);font-weight:500;white-space:nowrap}
.pc.just-lit .pc-img{animation:lit .9s ease-out}
@keyframes lit{0%{filter:grayscale(1) brightness(1.08);box-shadow:0 0 0 0 rgba(35,92,83,.6)}60%{box-shadow:0 0 0 10px rgba(35,92,83,0)}100%{filter:none}}

/* ── Cart ── */
#cartView{display:none}
.cart{background:var(--card);border-radius:26px;padding:18px;box-shadow:0 10px 30px -18px rgba(46,47,67,.35)}
.cart h2{margin:0 0 12px;font-size:22px;font-weight:700;font-style:italic}
.ci{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ci:first-of-type{border-top:0}
.ci-img{width:76px;height:76px;border-radius:16px;background-size:cover;background-position:center}
.ci-txt{min-width:0}
.ci-txt b{display:block;font-weight:600;font-size:14px;line-height:1.25}
.ci-txt small{display:block;color:var(--muted);font-size:12px}
.ci-txt .ci-pay{font-weight:600;font-size:15px;margin-top:4px;font-variant-numeric:tabular-nums}
.ci-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.rm{width:36px;height:36px;border-radius:12px;border:1.5px dashed color-mix(in srgb,var(--warn) 45%,transparent);color:var(--warn);display:grid;place-items:center}
.rm svg{width:16px;height:16px}
.ci .mini-step{box-shadow:none;border:1px solid var(--line)}
.empty{color:var(--muted);margin:4px 0 6px}
.sums{background:var(--soft);border-radius:20px;padding:14px 16px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.row span{color:var(--muted)}
.row s{color:var(--muted);font-variant-numeric:tabular-nums}
.row.total{font-size:16px;padding-top:8px;border-top:1px solid var(--line)}
.row.total span{color:var(--ink);font-weight:500}
.row.total b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.later{font-size:12px;color:var(--muted);margin:0}
.gmeter{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.gmeter i{display:block;height:100%;background:var(--orange);border-radius:99px;transition:width .25s ease}
.cta{width:100%;background:var(--orange);color:#fff;border-radius:999px;padding:14px 20px;font-weight:600;font-size:16px;min-height:54px;margin-top:14px}
.cta:disabled{opacity:.35;cursor:not-allowed}
.ghost{display:block;margin:8px auto 0;color:var(--muted);font-weight:500;padding:8px;min-height:44px;text-decoration:underline;text-underline-offset:3px}

/* ── Bottom nav ── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 14px calc(12px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:520px;margin:0 auto;background:var(--card);border-radius:999px;padding:6px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;align-items:center;box-shadow:0 10px 30px -10px rgba(46,47,67,.35)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;border-radius:999px;color:var(--ink);font-weight:600;font-size:11.5px;line-height:1.1;min-height:56px;min-width:0}
.nav button svg{width:22px;height:22px}
.nav button span.lbl{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button[aria-current="page"]{background:var(--orange);color:#fff}
.nav .badge{top:2px;right:calc(50% - 24px)}
.nav button[aria-current="page"] .badge{background:#fff;color:var(--orange)}

/* ── Sheet (pop-up) ── */
dialog.sheet{border:0;padding:0;background:var(--card);color:var(--ink);width:min(560px,100vw);max-width:100vw;max-height:calc(100% - 24px);border-radius:28px;overflow:auto;overscroll-behavior:contain}
dialog.sheet::backdrop{background:rgba(31,31,36,.5)}
@media (max-width:640px){
  dialog.sheet{margin:auto 0 0;width:100vw;border-radius:28px 28px 0 0;max-height:92%;padding-bottom:env(safe-area-inset-bottom,0px)}
  dialog.sheet[open]{animation:up .28s cubic-bezier(.2,.9,.3,1)}
}
@media (min-width:641px){dialog.sheet[open]{animation:pop .22s ease-out}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.sh{padding:14px 18px 20px;display:flex;flex-direction:column;gap:12px}
.sh-bar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:4;background:var(--card);margin:-14px -18px 0;padding:12px 18px 8px;touch-action:none;cursor:grab}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.round{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.round svg{width:20px;height:20px}
.sh-img{position:relative;aspect-ratio:4/3;border-radius:24px;background-size:cover;background-position:center;background-color:var(--line)}
.sh-img .anchor-pill{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.sh-img .anchor-pill span{background:var(--card);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;box-shadow:0 4px 10px -4px rgba(0,0,0,.25)}
.sh-img .anchor-pill s{color:var(--muted);font-weight:500}
.sh h2{margin:0;font-size:22px;font-weight:600;line-height:1.2}
.sh .sub{margin:-8px 0 0;color:var(--muted);font-size:14px}
.sh h4{margin:4px 0 -4px;font-size:15px;font-weight:600}
.sh .desc{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
.seg-chips{display:flex;gap:8px;flex-wrap:wrap}
.sc{min-width:64px;height:52px;padding:0 14px;border-radius:999px;background:var(--soft);font-weight:600;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;font-variant-numeric:tabular-nums}
.sc[aria-pressed="true"]{background:var(--orange);color:#fff}
.sc:disabled{opacity:.35;cursor:not-allowed}
.sc .vt{display:none;font-size:10px;font-weight:600;opacity:.8}
body.is-vendor .sc .vt{display:block}
.notice{display:flex;gap:8px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted)}
.notice svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
.notice .vwhy{display:none;color:var(--wine);font-weight:500}
body.is-vendor .notice .vwhy{display:block}
.sh-foot{position:sticky;bottom:0;background:var(--card);display:flex;align-items:center;gap:12px;padding-top:10px;margin-top:4px}
.sh-foot .qty{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:999px;padding:5px}
.sh-foot .qty button{width:40px;height:40px;border-radius:50%;background:var(--card);font-size:20px;display:grid;place-items:center;line-height:1}
.sh-foot .qty button.plus{background:var(--orange);color:#fff}
.sh-foot .qty button:disabled{opacity:.35;cursor:not-allowed}
.sh-foot .qty span{min-width:22px;text-align:center;font-weight:600;font-size:17px}
.sh-foot .cta{margin-top:0;flex:1}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{background:var(--soft);border-radius:16px;padding:10px 12px;font-size:12px;color:var(--muted);line-height:1.3}
.fact b{display:block;font-size:15px;color:var(--ink);font-weight:600;margin-top:2px}
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:16px;background:var(--soft);font-weight:500;min-height:54px;text-align:left}
.opt-row[aria-pressed="true"]{background:var(--orange);color:#fff}
.opt-row .dot{width:20px;height:20px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;opacity:.6}
.opt-row[aria-pressed="true"] .dot{opacity:1}
.opt-row[aria-pressed="true"] .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.done-mark{width:60px;height:60px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center}
.done-mark svg{width:30px;height:30px}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:11px 18px;border-radius:999px;font-weight:500;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s ease;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1}


/* ── v11 ── */
/* Tarjeta única de dinero: presupuesto del huésped + (con VIP) gift vouchers */
.money{margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 4px 14px -10px rgba(46,47,67,.3)}
.mrow{position:relative}
.mrow-g .vtxt b{color:var(--ok);font-size:20px;line-height:1.15;font-variant-numeric:tabular-nums}
.mchg{display:inline-flex;align-items:center;gap:6px;margin-right:10px;padding:8px 14px;border-radius:999px;background:var(--soft);color:var(--ink);font-weight:600;font-size:13.5px;min-height:44px}
.mchg svg{width:16px;height:16px}
.mrow-v{grid-column:1 / -1;border-top:1.5px solid var(--line);min-height:56px}
.mrow-v .vtxt b{font-size:14px}
.mrow.nudge{animation:nudge .32s ease}

/* Ahorro */
.save{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:14px;padding:10px 12px;background:var(--ok-soft);border:1.5px solid var(--ok-line);color:var(--ok);font-weight:600;font-size:15px}
.save b{font-size:20px;font-variant-numeric:tabular-nums}
button.save{width:100%;text-align:left;font-size:13.5px}
button.save span:last-child{white-space:nowrap}
.vs-col .save-l{font-size:13px;font-weight:700;margin-top:4px;color:var(--ok)}
.vs-col.vip .save-l{color:#9FE3C4}
.cmp-t tr.saverow td{color:var(--ok);font-weight:700}

/* Carrito: botón principal siempre a la vista */
.cta-bar{position:sticky;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));z-index:5;margin:14px -18px -18px;padding:12px 18px 18px;background:linear-gradient(to bottom,transparent,var(--card) 28%);border-radius:0 0 26px 26px}
.cta-bar .cta{margin-top:0;box-shadow:0 10px 24px -12px rgba(46,47,67,.55)}
.cta .cta-amt{opacity:.85;font-weight:500}
.cart-reset{display:flex;justify-content:flex-end;margin-top:2px}
.cart-reset .ghost{margin:0}

/* Botones +/− que no pueden sumar: se ven apagados pero explican por qué al tocarlos */
[aria-disabled="true"]{opacity:.38}

/* Lo que no alcanza: sección plegable al final del catálogo */
.off-head{display:flex;align-items:center;gap:12px;width:100%;margin-top:22px;padding:12px 14px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);text-align:left;min-height:60px}
.off-head .oh-txt{flex:1;min-width:0;line-height:1.25}
.off-head b{display:block;font-size:15px}
.off-head small{display:block;font-size:12.5px;color:var(--muted)}
.off-head .oh-n{min-width:30px;height:30px;border-radius:999px;background:var(--soft);display:grid;place-items:center;font-weight:600;font-size:13px;padding:0 8px;font-variant-numeric:tabular-nums}
.off-head svg{width:18px;height:18px;color:var(--muted);transition:transform .2s ease}
.off-head[aria-expanded="true"] svg{transform:rotate(180deg)}

/* Hoja de producto: cantidad antes de agregar */
.sh-foot .qty button[aria-disabled="true"]{opacity:.35}
@media (max-width:420px){.pc-info h3{font-size:14px}}

/* ── v11.4 · convenciones de navegación ── */
/* Barra superior fija: Atrás arriba a la izquierda, título de la pantalla, carrito arriba a la derecha */
.appbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--vend-h,0px));z-index:35;transition:background .2s ease,box-shadow .2s ease}
.appbar .wrap{display:flex;align-items:center;gap:10px;min-height:60px;padding-block:12px 4px}
.appbar.compact{background:color-mix(in srgb,var(--bg-top) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 1px 0 var(--line)}
.appbar.compact .wrap{padding-block:6px}
.appbar.compact .brand h1{font-size:20px}
.ab-btn{position:relative;flex-shrink:0;width:44px;height:44px;border-radius:50%;background:var(--card);color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 14px -8px rgba(46,47,67,.35)}
.ab-btn svg{width:22px;height:22px}
.ab-back{margin-left:-4px}
.ab-cart[aria-current="page"]{background:var(--orange);color:#fff}
.ab-cart .badge{top:-3px;right:-3px}
.ab-cart[aria-current="page"] .badge{background:#fff;color:var(--orange)}

/* El carrito "salta" cuando se agrega algo */
.badge.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:none}}

/* Hojas: Atrás a la izquierda, cerrar a la derecha; la barra se queda fija y se puede arrastrar hacia abajo */
.sh-back{background:var(--soft)}
dialog.sheet.dragging{transition:none!important;animation:none!important}
dialog.sheet.dragged{animation:none!important}   /* tras arrastrar, no repetir la animación de entrada */
dialog.sheet.settle{transition:transform .22s ease}

/* Aviso con acción (Deshacer) */
.toast.act{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 8px 8px 18px;text-align:left;width:min(420px,calc(100vw - 32px))}
/* En celular el título "Mi regalo" ya está en la barra superior */
@media (max-width:1079px){.cart > h2{display:none}}
.toast .t-act{flex-shrink:0;border-radius:999px;padding:8px 14px;min-height:40px;font-weight:700;font-size:14px;color:var(--ink);background:var(--card)}

/* ── v13 · guía visual "¿Qué se te antoja?" ── */
.gstrip{margin-top:16px}
.gstrip-head b{display:block;font-size:18px;font-weight:700;line-height:1.2}
.gstrip-head small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.gtiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
.gtile{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:1/1;text-align:left;color:#fff;box-shadow:0 8px 20px -14px rgba(20,20,40,.7);isolation:isolate}
.gtile .gc-img{position:absolute;inset:0;background-size:cover;background-position:center;background-color:var(--line);transition:transform .35s ease;z-index:-2}
.gtile::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,12,20,.82),rgba(10,12,20,0) 62%);z-index:-1}
.gtile:hover .gc-img{transform:scale(1.04)}
.gtile:active{transform:scale(.98)}
.gt-txt{position:absolute;left:12px;right:12px;bottom:11px;line-height:1.2}
.gt-txt b{display:block;font-size:16px;font-weight:700}
.gt-txt small{display:block;font-size:12px;opacity:.9;margin-top:2px}
@media (max-width:640px){
  .gtiles{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:10px -18px 0;padding:0 18px 4px}
  .gtiles::-webkit-scrollbar{display:none}
  .gtile{flex:0 0 42%;aspect-ratio:4/5;scroll-snap-align:start}
}
.g-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:-6px}
.g-eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.g-dots{display:flex;gap:5px}
.g-dots i{width:18px;height:4px;border-radius:4px;background:var(--line)}
.g-dots i.on{background:var(--orange)}
.gcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcards.text{grid-template-columns:1fr}
/* v25.1 · la foto de pareja es un collage (masaje arriba, camas abajo): se enfoca la parte de arriba en todas las tarjetas */
.pc-img.ph-couples,.gc-img.ph-couples,.ci-img.ph-couples,.sg-img.ph-couples,.wi-img.ph-couples,.hm-photo.ph-couples{background-position:50% 12%!important}
.g-banner.ph-couples_a{background-position:50% 35%}
.gcard .gc-img.gc-her{background-position:92% 55%!important}
.gcard .gc-img.gc-him{background-position:18% 55%!important}
.g-banner{aspect-ratio:16/7;border-radius:20px;background-size:cover;background-position:center;background-color:var(--line);margin:4px 0 2px}
.gcard{display:flex;flex-direction:column;text-align:left;border-radius:20px;background:var(--card);border:1.5px solid var(--line);overflow:hidden;min-height:64px;transition:transform .12s ease,border-color .12s ease}
.gcard:hover{border-color:var(--orange)}
.gcard:active{transform:scale(.98)}
.gcard .gc-img{display:block;aspect-ratio:4/3;background-size:cover;background-position:center;background-color:var(--line)}
.gcard.wide{grid-column:1 / -1}
.gcard.wide .gc-img{aspect-ratio:16/7}
.gc-body{display:flex;flex-direction:column;gap:3px;padding:10px 12px 12px;min-width:0}
.gc-body b{font-size:15px;line-height:1.25}
.gc-body small{font-size:12.5px;color:var(--muted);line-height:1.35}
.gc-tag{align-self:flex-start;margin-top:4px;font-size:12.5px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums}
.gcard.off .gc-tag{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.gcard.off .gc-img{filter:grayscale(.85)}
.gcards.text .gcard{padding:4px 4px}
.gcards.text .gc-body b{font-size:17px}
.g-price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:-4px}
.g-price b{font-size:22px;color:var(--ok);font-variant-numeric:tabular-nums}
.g-price s{color:var(--muted)}
.g-price em{font-style:normal;font-size:13px;font-weight:600;color:var(--ink);background:var(--soft);padding:4px 10px;border-radius:999px}
.g-done{display:flex;align-items:center;gap:14px}
.g-done .done-mark{flex-shrink:0;width:52px;height:52px}
.g-done h2{margin:0}
.g-done .sub{margin:2px 0 0}
.g-hydro{display:flex;align-items:center;gap:12px;border-radius:18px;border:1.5px solid var(--ok-line);background:var(--ok-soft);padding:8px;text-align:left;color:var(--ink)}
.g-hydro .gc-img{width:64px;height:64px;border-radius:12px;background-size:cover;background-position:center;flex-shrink:0}
.g-hydro .gc-body{flex:1;padding:0}
.g-hydro-add{font-weight:700;color:var(--ok);padding:0 8px;white-space:nowrap}

/* ── v14 · ♥ silencioso, "Súbele y entra", Llévate tu oferta ── */
.pill-wish.heart{padding:4px;min-height:38px}
.pill-wish.heart i{width:30px;height:30px}
.v-wish{flex-basis:100%;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;background:rgba(255,255,255,.08);border-radius:12px;padding:8px 8px 8px 12px;font-size:13px;line-height:1.3}
.v-wish[hidden]{display:none}
.v-wish > b{color:#F7A8C4;font-weight:600;min-width:0}
.v-wish span b{color:var(--gold-text)}
.v-wish button{margin-left:auto;background:var(--gold);color:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;min-height:40px}
.force{flex-wrap:wrap}
@media (max-width:640px){.force{flex-direction:column;align-items:stretch}.force-btn{white-space:normal}}
.force-btn{white-space:nowrap}
.share-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;min-height:50px;border-radius:999px;border:1.5px solid var(--navy);color:var(--navy);background:var(--card);font-weight:600;font-size:15px}
:root[data-theme="dark"] .share-btn{border-color:var(--gold);color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .share-btn{border-color:var(--gold);color:var(--ink)}}
.share-btn svg{width:20px;height:20px}
.offer-img{border-radius:20px;overflow:hidden;background:var(--soft);box-shadow:0 10px 30px -18px rgba(20,20,40,.6)}
.offer-img img{display:block;width:100%;height:auto}
.offer-wait{padding:80px 20px;text-align:center;color:var(--muted)}
.offer-qr{display:flex;align-items:center;gap:14px;background:var(--soft);border-radius:18px;padding:12px}
.offer-qr img{width:132px;height:132px;border-radius:10px;flex-shrink:0;image-rendering:pixelated}
.offer-qr p{margin:0;font-size:14px;line-height:1.45}
.vfield{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.vfield input{height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;font-size:16px;padding:0 14px}

/* ── v15 · paquetes del spa ── */
.lock.daytag{background:var(--navy);color:var(--gold-text);font-weight:600}
.lock.daytag.today{background:var(--gold);color:#fff}
.pkg-info{display:flex;flex-wrap:wrap;gap:6px;margin-top:-4px}
.pkg-info span{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--ink)}
.pkg-info span:first-child{background:var(--navy);color:var(--gold-text)}
.pkg-lc{margin:0;font-size:13px;color:var(--muted)}
.notice.vnote{display:none;color:var(--warn);font-weight:500}
body.is-vendor .notice.vnote{display:flex}
.v-icon.on{background:var(--gold)}

/* ── v17.3 · adaptable: celular o tablet, vertical u horizontal ── */
/* Desde 760px de ancho, idioma y tema suben a la fila del título: se gana una fila completa */
@media (min-width:760px){
  .top{position:relative;z-index:36;margin-top:-56px;pointer-events:none}
  .top .wrap{justify-content:flex-end;min-height:56px;padding-top:0;padding-bottom:0}
  .top .hdr-row{pointer-events:auto;margin-left:auto}
}
@media (min-width:760px) and (max-width:1079px){.top .wrap{padding-right:74px}}   /* deja libre el botón del carrito */
/* Tablet horizontal (p. ej. Galaxy Tab S9 Ultra, 16:10): pantalla baja y ancha → fotos menos altas para ver más productos */
@media (orientation:landscape) and (min-width:1080px){
  .layout .wrap{padding-top:4px}
  .gtile{aspect-ratio:16/10}
  .pc-img{aspect-ratio:4/3}
  .hero{min-height:200px}
  .hero h2{font-size:clamp(30px,3.4vw,46px)}

}

/* Celular horizontal (pantalla muy baja): sin barra de abajo (el carrito sigue arriba a la derecha) y todo más compacto */
@media (orientation:landscape) and (max-height:520px){
  :root{--nav-h:0px}
  .nav{display:none!important}
  .appbar .wrap{min-height:48px;padding-block:4px 2px}
  .brand h1{font-size:22px}
  .top{margin-top:-50px}
  .top .wrap{min-height:50px}
  .layout .wrap{padding-top:2px;padding-bottom:32px}
  .modes{margin-top:4px}
  .gtile{aspect-ratio:16/9}
  .pc-img{aspect-ratio:4/3}
  .hero{min-height:0}
  .hero h2{font-size:32px}
  .hero-photo{min-height:0}
  dialog.sheet{max-height:calc(100% - 10px)}
  .sh-img,.sh-img.main{max-height:44vh}   /* la foto no se come la hoja: se ve el nombre y el precio sin bajar */

}
/* ── v18 · menos ruido ── */
.money.nobud .mrow-g.slim{min-height:46px;padding:8px 14px}
.money.nobud .mrow-g.slim small{font-size:13.5px;color:var(--muted)}
.money.nobud .mrow-g.slim small,.money.nobud .mrow-g.slim b{display:inline;font-size:14px;line-height:1.3}
.money.nobud .mrow-g.slim b{color:var(--ink);font-weight:600}
.money.nobud .mchg{padding:6px 14px;min-height:36px;font-size:13px}
.money.nobud.solo{background:transparent;border-style:dashed;box-shadow:none}
.pc-info .pc-price{justify-content:flex-start;gap:6px;align-items:baseline}
.pc-price s{font-size:12.5px;font-weight:500;color:var(--muted);margin-left:2px}
.mini-step button.dec-rm{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.mini-step button.dec-rm svg{width:15px;height:15px}
.cart-reset{justify-content:space-between;gap:8px}
.cart-reset .ghost{white-space:nowrap;font-size:14px;padding-inline:4px}
/* v19 · tablet: con el regalo vacío el panel se colapsa y el catálogo usa todo el ancho */

}
@keyframes cartIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
/* v19 · "¿Qué se te antoja?" es el arranque de la plática: tarjetas más altas */
@media (min-width:641px){
  .gtile{aspect-ratio:4/5}
  .gt-txt{left:16px;right:16px;bottom:16px}

}

/* v22 · logos de parques */
.pc-logo{position:absolute;top:8px;right:8px;z-index:2;background:rgba(42,43,64,.88);border-radius:10px;padding:5px 9px;line-height:0;box-shadow:0 4px 10px -6px rgba(0,0,0,.5)}

.cert-opt{margin:12px 0 4px;padding:10px 14px;border-radius:14px;background:var(--soft);font-size:14px;line-height:1.4;color:var(--ink)}
/* v18.1 · tablet: 3 productos por fila (tarjetas más grandes, menos saturado) */
@media (min-width:1080px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 16px}}
/* v18.1 · idioma/tema pasan por DEBAJO de la barra fija al bajar (antes se encimaban) */
@media (min-width:760px){
  .top{z-index:34}
  .appbar{pointer-events:none}
  .appbar .wrap > *{pointer-events:auto}
  .appbar .wrap > .brand{pointer-events:none}

/* ── v20 · tablet grande: letra más visible y banner de la escapada ── */
.hero h2{font-style:normal;font-variant-numeric:lining-nums;letter-spacing:-.01em;line-height:1.05;font-size:clamp(23px,6vw,46px)}

@media (min-width:1080px){
  body{font-size:16.5px}

  .vtxt b{font-size:17px}.vtxt small{font-size:14px}

  .gstrip-head b{font-size:24px}.gstrip-head small{font-size:15px;margin-top:4px}
  .gt-txt b{font-size:25px}.gt-txt small{font-size:15px}
  .pc-info{padding-top:4px}
  .pc-info h3{font-size:19px;line-height:1.25}
  .pc-price b{font-size:20px}.pc-price s{font-size:15px}
  .pill-add{font-size:15px;min-height:44px;padding:5px 16px 5px 5px}.pill-add i{width:34px;height:34px;font-size:20px}
  .mini-step button{width:38px;height:38px;font-size:20px}.mini-step span{min-width:26px;font-size:17px}
  .lock{font-size:13px;padding:6px 12px}
  .cart h2{font-size:27px}
  .ci-txt b{font-size:16px}.ci-txt small{font-size:13.5px}.ci-txt .ci-pay{font-size:17px}
  .row{font-size:15.5px}.row.total{font-size:18px}.row.total b{font-size:26px}
  .later{font-size:13.5px}
  .cta{font-size:18px;min-height:58px}
  .sugg-head b{font-size:17px}.sg b{font-size:14px}.sg small{font-size:13.5px}
  .cart-reset .ghost{font-size:15px}
  /* Banner de la escapada: mitad texto, mitad foto, más alto y con letra a escala */
  .hero{grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:330px}
  .hero-body{padding:30px 16px 30px 34px;gap:10px}
  .hero-kicker{font-size:14px}
  .hero h2{font-size:clamp(44px,4.4vw,60px)}
  .hero .lede{font-size:18px;max-width:34ch;line-height:1.4}
  .hero-facts{gap:22px;margin-top:6px}
  .hero-facts div{font-size:14px}.hero-facts b{font-size:19px}

  .hm-txt b{font-size:24px}.hm-txt small{font-size:14.5px}
  .fact{font-size:13.5px}

  body:not(.cart-empty) .hero .lede{font-size:16.5px}

/* ── v25 · interruptor VIP Services arriba; la pastilla de presupuesto completa es tocable ── */
#modes{display:none!important}
.hdr-row{flex-wrap:nowrap;width:100%}
.vip-sw{order:3}
.vip-sw{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:4px 6px 4px 14px;border-radius:999px;background:var(--card);box-shadow:0 4px 14px -8px rgba(46,47,67,.3);font-weight:600;font-size:13.5px;color:var(--ink);margin-left:auto}
.vip-sw .star{color:var(--gold);margin-right:4px}
.vs-track{position:relative;width:46px;height:28px;border-radius:999px;background:var(--line);transition:background .25s ease;flex-shrink:0}
.vs-track i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.vip-sw[aria-checked="true"] .vs-track{background:var(--gold)}
.vip-sw[aria-checked="true"] .vs-track i{transform:translateX(18px)}
.vip-sw[aria-checked="true"]{color:var(--gold-text);background:var(--navy)}
@media (min-width:760px){.vip-sw{margin-left:0}.top .hdr-row{width:auto}}
/* celular: todo en una fila (idioma · tema · VIP) */
@media (max-width:759px){
  .vip-sw{gap:7px;font-size:12.5px;padding:3px 4px 3px 11px;min-height:40px}
  .vs-track{width:40px;height:24px}.vs-track i{width:18px;height:18px}
  .vip-sw[aria-checked="true"] .vs-track i{transform:translateX(16px)}
}
@media (max-width:374px){.vs-lbl .vs-sv{display:none}}
@media (min-width:1080px){.vip-sw{font-size:15px;min-height:48px;padding-left:16px}}
.mrow-g{cursor:pointer}
.money.nobud .mrow-g.slim:active{opacity:.7}
/* ── v25.4 · barra de abajo pegada al borde (sin flotar), 3 botones ── */
:root{--nav-h:62px}
.nav{padding:0;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 18px -14px rgba(0,0,0,.45)}
.nav-in{max-width:none;border-radius:0;background:transparent;box-shadow:none;padding:4px 10px calc(4px + env(safe-area-inset-bottom,0px));grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.nav button{min-height:52px;border-radius:16px;padding:4px}
.nav button[aria-current="page"]{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.nav button[aria-current="page"] .badge{background:var(--orange);color:#fff}
#navStay{color:var(--muted)}
#navStay.vip-on{color:#A87C1E}
:root[data-theme="dark"] #navStay.vip-on{color:#E6B95A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #navStay.vip-on{color:#E6B95A}}
.cta-bar{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
.toast{bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px))}
.cart-lc{margin:-4px 0 12px}
.cart-lc .mrow-v{border:1.5px solid var(--line);border-radius:18px;border-top-width:1.5px}
@media (min-width:1080px){.cart-lc{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

    ${sheetTop(t().budgetTitle)}
    <p class="sub" style="margin-top:-6px">${t().budgetHint}</p>
    <div class="opt-list"><button class="opt-row" data-will="open" aria-pressed="${!hasBud()}"><span>${t().budOpenOpt}</span><span class="dot"></span></button>${WILL.map(w => `<button class="opt-row" data-will="${w}" aria-pressed="${S.will === w}"><span>${w === 0 ? t().free : t().upTo(w)}</span><span class="dot"></span></button>`).join('')}</div>`;
}
// Reparte el Leisure Cash entre las piezas: lo que no cubre el regalo lo paga el huésped
function splitVip(v) {
  let lc = S.step; const out = {};
  for (const id of S.cart.order) {
    const it = itemById(id), u = v.units[id] || [];
    const b = u.reduce((a, i) => a + it.opts[i].b, 0), pay = unitPay(it, u);
    const fromLc = Math.min(b, lc); lc -= fromLc;
    out[id] = { lc: fromLc, cash: pay + (b - fromLc) };
  }
  return out;
}
function vipCell(x) {
  if (!x.lc && !x.cash) return `<span class="free">${t().free2}</span>`;
  const lc = x.lc ? `<span class="lcv">${t().lcShort(money(x.lc))}</span>` : '';
  const cash = x.cash ? `<span>${x.lc ? '+ ' : ''}${money(x.cash)}</span>` : '';
  return lc + cash;
}
function compareSheet() {
  const L = S.lang, r = calcReg(S.cart), v = calcVip(S.cart), sp = splitVip(v);
  const rows = [];
  if (S.cart.cert) rows.push(`<tr><td>${t().certTitle}</td><td class="na">—</td><td class="vip">${vipCell({ lc: 0, cash: 0 })}</td></tr>`);
  for (const id of S.cart.order) {
    const it = itemById(id), s = S.cart.sel[id];
    if (it.kidOf) continue;
    if (it.kid) {
      const k = sp[it.kid] || { lc: 0, cash: 0 }, a = sp[id];
      rows.push(`<tr><td>${it.name[L]} <small>${paxText(s.qty, kidsOf(it))}</small></td><td>${money(lineRegAll(it, s))}</td><td class="vip">${vipCell({ lc: a.lc + k.lc, cash: a.cash + k.cash })}</td></tr>`);
      continue;
    }
    const kind = it.kinds ? ` <small>${kindSummary(it, s)}</small>` : '';
    rows.push(`<tr><td>${id === 'cbd' ? '↳ ' : ''}${s.qty}× ${it.name[L]}${kind}</td>${it.vipOnly ? '<td class="na">—</td>' : `<td>${money(lineReg(it, s) - lineCoupon(it, s))}${lineCoupon(it, s) ? `<small><s>${money(lineReg(it, s))}</s></small>` : ''}</td>`}<td class="vip">${vipCell(sp[id])}</td></tr>`);
  }
  const lcUsed = Object.values(sp).reduce((a, x) => a + x.lc, 0);
  const st = cost => !hasBud() ? '' : cost > S.will ? `<span class="over">${t().overBy(money(cost - S.will))}</span>` : t().left(money(S.will - cost));
  const [m1, m2] = vsMessage();
  return `${sheetTop(t().cmpTitle)}
    ${hasBud() ? `<p class="sub" style="margin-top:-6px">${t().yourBudget}: ${money(S.will)}</p>` : ''}
    <div class="cmp-wrap"><table class="cmp-t">
      <thead><tr><th></th><th>${t().modeReg}<small style="display:block;font-weight:500">${t().withCoupons}</small></th><th class="vip">✦ ${t().modeVip}</th></tr></thead>
      <tbody>${rows.join('')}</tbody>
      <tfoot>
        ${lcUsed ? `<tr class="lcrow"><td>${t().lcUsed}</td><td class="na">—</td><td class="vip"><span class="lcv">${money(lcUsed)}</span></td></tr>` : ''}
        ${r.couponsRaw > r.coupons ? `<tr class="lcrow"><td>${t().couponCap(money(COUPON.total))}</td><td>+${money(r.couponsRaw - r.coupons)}</td><td class="na">—</td></tr>` : ''}
        <tr class="tot"><td>${t().todayPay}</td><td>${money(r.cost)}</td><td class="vip">${money(v.cost)}</td></tr>
        ${r.cost - v.cost > 0 ? `<tr class="saverow"><td>${t().youSave}</td><td class="na">—</td><td class="vip">${money(r.cost - v.cost)}</td></tr>` : ''}
        <tr><td>${t().yourBudget}</td><td>${st(r.cost)}</td><td class="vip">${st(v.cost)}</td></tr>
      </tfoot>
    </table></div>
    <p class="vs-msg" style="margin:0">${m1}</p>
    <p class="cmp-note">${t().cmpNote2}</p>
    <p class="cmp-note">${t().couponNote()}</p>
    <div class="sh-foot"><button class="cta" data-close>${t().close}</button></div>`;
}
function summarySheet() {
  return `${sheetTop(t().picks)}${cartItemsHTML(false)}${sumsHTML()}
    <div class="sh-foot stack"><button class="cta" data-confirm>${t().confirm}</button><button class="cta ghost-cta" data-close>${t().keep}</button></div>`;
}
function doneSheet() {
  return `${sheetTop('')}<div class="done-mark">${ICON.check}</div><h2>${t().doneTitle}</h2><p class="desc">${t().doneText}</p>${cartItemsHTML(false)}${sumsHTML()}
    <div class="sh-foot"><button class="cta" data-newguest>${t().newGuest}</button></div>`;
}
function renderSheet() {
  if (!S.sheet) return;
  const sh = S.sheet, body =
    sh.kind === 'item' ? itemSheet(sh.id) : sh.kind === 'cert' ? certSheet() : sh.kind === 'budget' ? budgetSheet() :
    sh.kind === 'guide' ? guideSheet() : sh.kind === 'share' ? shareSheet() : sh.kind === 'vdata' ? vdataSheet() : sh.kind === 'dbg' ? dbgSheet() : sh.kind === 'compare' ? (count() ? compareSheet() : '') : sh.kind === 'summary' ? (count() ? summarySheet() : '') : doneSheet();
  if (!body) { closeSheet(); return; }
  const keep = $('sheet').scrollTop, tEl = document.getElementById('toast'), tIn = tEl && tEl.parentNode === $('sheet');
  $('sheet').innerHTML = `<div class="sh">${body}</div>`;
  if (tIn) $('sheet').appendChild(tEl);   // conserva el aviso visible al repintar la hoja
  $('sheet').scrollTop = keep;
}
function openSheet(kind, id, prev = null) { if (kind === 'item') S.pend = 1; S.sheetPrev = prev; S.sheet = { kind, id }; renderSheet(); if (!$('sheet').open) { $('sheet').showModal(); $('sheet').scrollTop = 0; } renderTabs(); }
function closeSheet() { S.sheet = null; S.sheetPrev = null; if ($('sheet').open) $('sheet').close(); }
$('sheet').addEventListener('close', () => { const tEl = document.getElementById('toast'); if (tEl && tEl.parentNode === $('sheet')) document.body.appendChild(tEl); S.sheet = null; $('sheet').style.transform = ''; $('sheet').classList.remove('dragged', 'settle', 'dragging'); renderTabs(); });
// Deslizar la barra de la hoja hacia abajo para cerrarla
let drag = null;
$('sheet').addEventListener('pointerdown', e => {
  if (!e.target.closest('.sh-bar') || e.target.closest('button')) return;
  drag = { y: e.clientY, dy: 0, id: e.pointerId };
  try { $('sheet').setPointerCapture(e.pointerId); } catch (err) {}
  $('sheet').classList.add('dragging'); $('sheet').classList.remove('settle');
});
$('sheet').addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.dy = Math.max(0, e.clientY - drag.y);
  $('sheet').style.transform = `translateY(${drag.dy}px)`;
});
// v24.2 · al soltar, la hoja termina de bajar con la misma duración con la que sube al abrirse (no desaparece de golpe)
let closeFully = false;
function slideClose() {
  const sh = $('sheet'); closeFully = true;
  sh.style.transition = 'transform .3s cubic-bezier(.4,0,.9,.6)';
  requestAnimationFrame(() => { sh.style.transform = 'translateY(100vh)'; });
  setTimeout(() => { sh.style.transition = ''; backAction(); }, 300);
}
function endDrag(e) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  const far = drag.dy > 90; drag = null;
  $('sheet').classList.remove('dragging'); $('sheet').classList.add('dragged');
  if (far) { slideClose(); return; }
  $('sheet').classList.add('settle'); $('sheet').style.transform = '';
}
['pointerup', 'pointercancel'].forEach(ev => $('sheet').addEventListener(ev, endDrag));
// v24 · seguir "subiendo" cuando la hoja ya está hasta arriba la cierra (como bajar la barra)
let pull = null;
$('sheet').addEventListener('touchstart', e => {
  if (e.touches.length !== 1 || e.target.closest('.sh-bar')) { pull = null; return; }
  pull = { y0: e.touches[0].clientY, start: null, dy: 0 };
}, { passive: true });
$('sheet').addEventListener('touchmove', e => {
  if (!pull) return;
  const sh = $('sheet'), y = e.touches[0].clientY;
  if (pull.start === null) {
    if (sh.scrollTop > 0 || y <= pull.y0) { pull.y0 = y; return; }   // aún hay contenido arriba, o el dedo va hacia arriba
    pull.start = y; sh.classList.add('dragging'); sh.classList.remove('settle');
  }
  pull.dy = Math.max(0, y - pull.start);
  if (pull.dy > 0) { e.preventDefault(); sh.style.transform = `translateY(${pull.dy * 0.85}px)`; }
}, { passive: false });
function endPull() {
  if (!pull) return;
  const p = pull; pull = null; if (p.start === null) return;
  const sh = $('sheet'); sh.classList.remove('dragging'); sh.classList.add('dragged');
  if (p.dy > 110) { slideClose(); return; }
  sh.classList.add('settle'); sh.style.transform = '';
}
['touchend', 'touchcancel'].forEach(ev => $('sheet').addEventListener(ev, endPull));
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });

/* ── Precio de cada opción, siempre desde la lógica del carrito ── */
function gExtra(id, kind, n = 1) {
  const it = itemById(id), cur = selOf(id);
  if (!(kind && it.kinds)) return {};
  return cur.qty ? { pk: [...personKinds(it, cur), ...Array(n * (it.unit || 1)).fill(kind)] } : { kind };
}
function gAfter(id, kind, n = 1) { return withItem(S.cart, id, selOf(id).qty + n, gExtra(id, kind, n)); }
function gTag(id, kind, n = 1) {
  const after = gAfter(id, kind, n), d = costIn(S.mode, after) - costIn(S.mode, S.cart), over = costIn(S.mode, after) - S.will;
  if (over > 0) return { txt: gt().needs(money(over)), off: true };
  return { txt: d <= 0 ? gt().free : (S.mode === 'vip' && hasDiscount(itemById(id)) ? t().promo + ' ' : '') + money(d), off: false };
}
function gFits(id, kind, n = 1) {
  const it = itemById(id);
  return !(it.vipOnly && S.mode === 'reg') && selOf(id).qty + n <= it.max && costIn(S.mode, gAfter(id, kind, n)) <= S.will;
}

/* ── Navegación de la guía ── */
function openGuide(path = []) {

function gGo(id, p = {}) { S.guide.stack.push({ id, p }); renderSheet(); $('sheet').scrollTop = 0; }
function gBackStep() { if (S.guide.stack.length > 1) { S.guide.stack.pop(); renderSheet(); $('sheet').scrollTop = 0; return true; } return false; }
function gAdd(id, kind, n, force) {
