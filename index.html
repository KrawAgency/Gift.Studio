/* ── Eventos ── */
document.addEventListener('click', e => {
  const el = e.target.closest('button, [data-open], [data-cert-open]');
  if (!el || el.disabled) return;
  const d = el.dataset;
  if (d.lang) { S.lang = d.lang; store.set('lang', S.lang); render(); return; }
  if (el.hasAttribute('data-back')) { backAction(); return; }
  if (el.hasAttribute('data-share')) { openShare(); return; }
  if (el.hasAttribute('data-sharesave')) { saveOffer(); return; }
  if (el.hasAttribute('data-vsave')) { store.set('vname', $('vName').value.trim().slice(0, 40)); store.set('vphone', $('vPhone').value.replace(/\D/g, '').slice(0, 15)); closeSheet(); toast(shr().saved.replace(/Imagen guardada|Image saved/, S.lang === 'es' ? 'Datos guardados' : 'Details saved')); return; }
  if (d.gstart) { const map = { spa: [['spa']], bali: [['bali']], dinner: [['dinner']], exc: [['exc']] }; openGuide(map[d.gstart] || []); return; }
  if (d.gi !== undefined) { guideTap(Number(d.gi)); return; }
  if (el.hasAttribute('data-gadd') || el.hasAttribute('data-gforce')) { const p = S.guide.stack[S.guide.stack.length - 1].p; gAdd(p.id, p.kind, p.n || 1, el.hasAttribute('data-gforce')); return; }
  if (el.hasAttribute('data-gwish')) { const p = S.guide.stack[S.guide.stack.length - 1].p; toggleWish(p.id); return; }
  if (el.hasAttribute('data-graise')) { const p = S.guide.stack[S.guide.stack.length - 1].p; if (raiseAdd(p.id, p.kind, p.n || 1)) gGo('done', p); return; }
  if (el.hasAttribute('data-gdetail')) { const p = S.guide.stack[S.guide.stack.length - 1].p; if (p.kind) kindMemo[p.id] = p.kind; openSheet('item', p.id, 'guide'); return; }
  if (d.ghydro) { S.cart = withItem(S.cart, 'hydro', Number(d.ghydro)); render(); return; }
  if (el.hasAttribute('data-gtocart')) { closeSheet(); switchTab('cart'); return; }
  if (d.gall) { const [gc, gs] = d.gall.split(':'); closeSheet(); S.tab = 'catalog'; S.cat = gc; S.sub = gs || 'all'; render(); window.scrollTo({ top: 0 }); return; }
  if (d.tab) { switchTab(d.tab); return; }
  if (d.mode) { setMode(d.mode); return; }
  if (el.hasAttribute('data-budget')) { openSheet('budget'); return; }
  if (d.will !== undefined) { S.will = d.will === 'open' ? Infinity : Number(d.will); render(); setTimeout(closeSheet, 180); return; }
  if (el.hasAttribute('data-cert-open')) { openSheet('cert'); return; }
  if (el.hasAttribute('data-cert')) { if (S.mode !== 'vip') S.mode = 'vip'; S.cart.cert = !S.cart.cert; render(); return; }
  if (el.hasAttribute('data-compare')) { openSheet('compare'); return; }

  if (el.hasAttribute('data-offtoggle')) { S.showOff = !S.showOff; render(); return; }
  if (el.hasAttribute('data-pdec')) { S.pend = Math.max(1, S.pend - 1); renderSheet(); return; }
  if (d.pinc) { if (pendFits(d.pinc, S.pend + 1)) S.pend++; else toast(pendWhy(d.pinc)); renderSheet(); return; }
  if (d.addn) { addPending(d.addn); return; }
  if (d.sub) { S.sub = d.sub; render(); return; }
  if (d.cat) { if (S.tab !== 'catalog') S.tab = 'catalog'; S.cat = d.cat; S.sub = 'all'; render(); return; }
  if (el.hasAttribute('data-dbgcopy')) {
    const ta = $('dbgTxt'); ta.focus(); ta.select();
    const done = () => toast('Copiado');
    try { navigator.clipboard.writeText(ta.value).then(done, () => { try { document.execCommand('copy'); done(); } catch (e) { toast('Selecciona y copia a mano'); } }); }
    catch (e) { try { document.execCommand('copy'); done(); } catch (e2) { toast('Selecciona y copia a mano'); } }
    return;
  }
  if (d.dur) {
    const from = d.dur, to = d.to; if (from === to) return;
    if (S.cart.sel[from] && S.cart.sel[from].qty) {
      const c = durSwap(from, to), over = costIn(S.mode, c) - S.will;
      if (over > 0 && costIn(S.mode, c) > costIn(S.mode, S.cart)) { toast(t().overBudget(money(over))); return; }
      S.cart = c; render(); toast(t().durChanged(DUR_MIN[to]));
    }
    openSheet('item', to, S.sheetPrev); return;
  }
  if (d.cbd) { toggleCbd(d.cbd, Number(d.n)); return; }
  if (el.hasAttribute('data-rmcbd')) { toast(t().removedX(itemById('cbd').name[S.lang]), undoTo(snapCart())); for (const x of S.cart.order) { const sl = S.cart.sel[x]; if (itemById(x).kinds && sl) sl.cbd = []; } render(); return; }
  if (el.hasAttribute('data-cbdadd')) { for (const x of S.cart.order) { const it = itemById(x), sl = S.cart.sel[x]; if (!it.kinds) continue; const cb = personCbd(it, sl), n = cb.indexOf(false); if (n >= 0) { toggleCbd(x, n); return; } } return; }
  if (el.hasAttribute('data-upg')) { const f = d.upg || 'massage', c = upgradeCart(f); if (c) { S.cart = c; render(); toast(t().upgradedTo(itemById(UPGRADES.find(x => x.from === f).to).name[S.lang])); } return; }
  if (d.raise) { raiseAdd(d.raise); return; }
  if (d.force) { forceAdd(d.force); return; }
  if (d.wish) { toggleWish(d.wish); return; }
  if (d.wmove) { moveWish(d.wmove); return; }
  if (d.wrm) { delete S.wish[d.wrm]; render(); return; }
  if (el.hasAttribute('data-wall')) { moveAllWish(); return; }
  if (el.hasAttribute('data-wraise')) { const snap = snapAll(); S.will = Math.min(GUEST_MAX, S.will + Math.ceil(wishGap() / 50) * 50); moveAllWish(); toast(t().raised(money(S.will)), undoTo(snap)); return; }
  if (d.wgive) { const k = Number(d.wgive); S.step += k; bump(); moveAllWish(); toast('+' + money(k) + ' en vouchers'); return; }
  if (d.inc) { if (canAdd(d.inc)) { S.fresh = S.fresh.filter(x => x !== d.inc); if (S.wish[d.inc]) delete S.wish[d.inc]; } inc(d.inc); return; }
  if (d.dec) { dec(d.dec); return; }
  if (d.opt) { setOpt(d.opt, Number(d.i)); return; }
  if (d.kind) { kindMemo[d.kind] = d.k; if (S.cart.sel[d.kind]) { S.cart.sel[d.kind].kind = d.k; S.cart.sel[d.kind].pk = null; } render(); return; }
  if (d.pk) {
    const it = itemById(d.pk), sl = S.cart.sel[d.pk]; if (!sl) return;
    const pk = personKinds(it, sl), n = Number(d.n);
    pk[n] = d.k || (pk[n] === 'relax' ? 'deep' : 'relax'); sl.pk = pk; render(); return;
  }
  if (d.open) { openSheet('item', d.open); return; }
  if (d.rm) { setQty(d.rm, 0); return; }
  if (el.hasAttribute('data-rmcert')) { const snap = snapCart(); S.cart.cert = false; render(); toast(t().removedX(t().stayTitle), undoTo(snap)); return; }
  if (el.hasAttribute('data-book')) { openSheet('summary'); return; }
  if (el.hasAttribute('data-reset')) { const snap = snapAll(); resetAll(); toast(t().cleared, undoTo(snap)); return; }
  if (el.hasAttribute('data-close')) { closeSheet(); return; }
  if (el.hasAttribute('data-confirm')) { openSheet('done'); return; }
  if (el.hasAttribute('data-newguest')) { resetAll(); return; }
});
window.matchMedia('(min-width:1080px)').addEventListener('change', () => { renderStatic(); renderTabs(); });

/* Modo vendedor: mantén presionado el título ~1.2 s, o tecla V. Sin toast: la franja superior es la única señal */
function setVendor(on) { S.vendor = on; renderVendor(); syncVendH(); }
let pressTimer = null;
$('brand').addEventListener('pointerdown', () => { pressTimer = setTimeout(() => setVendor(!S.vendor), 1200); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => $('brand').addEventListener(ev, () => clearTimeout(pressTimer)));
$('brand').addEventListener('contextmenu', e => e.preventDefault());
/* ── Tema claro / oscuro ── */
function syncTheme() { const t = document.documentElement.getAttribute('data-theme'); document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeSet === t))); }
document.querySelectorAll('[data-theme-set]').forEach(b => b.addEventListener('click', () => { document.documentElement.setAttribute('data-theme', b.dataset.themeSet); try { localStorage.setItem('gs-theme', b.dataset.themeSet); } catch (e) {} syncTheme(); }));
syncTheme();

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || (e.altKey && e.key !== 'ArrowLeft')) return;
  if ((e.key === 'Escape' || (e.altKey && e.key === 'ArrowLeft')) && !$('sheet').open && canBack()) { e.preventDefault(); backAction(); return; }
  if ((e.key === 'v' || e.key === 'V') && !$('sheet').open) setVendor(!S.vendor);
  if (S.vendor && S.mode === 'vip' && (e.key === '+' || e.key === '=')) { e.preventDefault(); vPlus(); }   // +/− da o quita un voucher
  if (S.vendor && S.mode === 'vip' && e.key === '-') { e.preventDefault(); vMinus(); }
});
$('vendorClose').addEventListener('click', () => setVendor(false));
$('vipSw').addEventListener('click', () => setMode(S.mode === 'vip' ? 'reg' : 'vip'));
$('vDataBtn').addEventListener('click', () => openSheet('vdata'));
$('vRainBtn').addEventListener('click', () => {
  const it = itemById('pk-rain'); it.hidden = !it.hidden;
  $('vRainBtn').setAttribute('aria-pressed', String(!it.hidden)); $('vRainBtn').classList.toggle('on', !it.hidden);
  render(); toast(it.hidden ? 'Día de lluvia: oculto' : 'Día de lluvia: visible en Spa → Paquetes');
});
$('fsBtn').addEventListener('click', () => { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); } catch (e) {} });

let lastTap = { t: 0, side: null }, budTapTimer = 0;
document.addEventListener('pointerup', e => {
  const row = e.target.closest('[data-vrow]'); if (!row) return;
  const r = row.getBoundingClientRect(), side = (e.clientX - r.left) > r.width / 2 ? 'R' : 'L', now = performance.now();
  const key = row.dataset.vrow + side;
  if (row.dataset.vrow === 'budget' && !e.target.closest('button')) { clearTimeout(budTapTimer); if (!(now - lastTap.t < 350 && lastTap.side === key)) budTapTimer = setTimeout(() => openSheet('budget'), 360); }
  if (now - lastTap.t < 350 && lastTap.side === key) { lastTap = { t: 0, side: null }; if (row.dataset.vrow === 'budget') side === 'R' ? gPlus() : gMinus(); else side === 'R' ? vPlus() : vMinus(); }
  else lastTap = { t: now, side: key };
});
document.addEventListener('dblclick', e => { if (e.target.closest('[data-vrow]')) e.preventDefault(); });

/* Estado actual para troubleshooting */
function snapshot() {
  const v = calcVip(S.cart), r = calcReg(S.cart);
  const lines = S.cart.order.map(id => { const it = itemById(id), sl = S.cart.sel[id];
    return { id, qty: sl.qty, kinds: it.kinds ? personKinds(it, sl) : undefined, cbd: it.kinds ? personCbd(it, sl) : undefined, manualOpt: sl.manual ? sl.opt : undefined,
      vipUnits: (v.units[id] || []).map(i => `${it.opts[i].pay}/${it.opts[i].b}`), regular: lineReg(it, sl) }; });
  return {
    app: 'Gift Studio v25.4', time: new Date().toISOString(), lang: S.lang, mode: S.mode,
    guestBudget: hasBud() ? S.will : null, vouchers: S.step / VOUCHER, voucherValue: S.step, 
    cert: S.cart.cert, cart: lines, wish: S.wish,
    vip: { guestPays: v.cost, copays: v.pay, budgetUsed: v.used, overflow: v.overflow, left: S.will - v.cost, regularValue: v.value },
    reg: { guestPays: r.cost, left: S.will - r.cost },
    addableNow: addable(), freshlyUnlocked: S.fresh,
    screen: `${innerWidth}x${innerHeight}`, ua: navigator.userAgent,
  };
}
function dbgSheet() {
  const txt = JSON.stringify(snapshot(), null, 1);
  return `${sheetTop('Estado actual')}
    <p class="sub" style="margin-top:-6px">Cópialo y mándalo en el chat junto con lo que esperabas ver.</p>
    <textarea id="dbgTxt" readonly style="width:100%;min-height:260px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);font:12px/1.4 ui-monospace,Menlo,monospace;padding:10px">${txt.replace(/</g, '&lt;')}</textarea>
    <div class="sh-foot"><button class="cta" data-dbgcopy>Copiar</button></div>`;
}
$('dbgBtn').addEventListener('click', () => openSheet('dbg'));

let toastTimer = null;
const TOAST = $('toast');
function toast(msg, act) {
  const el = TOAST, host = $('sheet').open ? $('sheet') : document.body;
  if (el.parentNode !== host) host.appendChild(el);   // sobre una hoja abierta, el aviso va dentro de ella para que se vea
  el.textContent = ''; el.append(msg);
  el.classList.toggle('act', !!act);
  if (act) {
    const b = document.createElement('button'); b.className = 't-act'; b.textContent = act.label;
    b.addEventListener('click', ev => { ev.stopPropagation(); el.classList.remove('show'); act.fn(); });
    el.append(b);
  }
  el.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), act ? 5000 : 1800);
}

render();

</script>
</body>
</html>
